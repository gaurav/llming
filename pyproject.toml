# The scripts here are standalone and declare their own dependencies in PEP 723 headers; this file
# exists only to give the repo a shared test runner, so `uv run pytest` works from the root.
[project]
name = "llming"
version = "0"
requires-python = ">=3.9"

[dependency-groups]
# Test-only. Everything past pytest is here because the tests import the scripts,
# which import these.
dev = ["pytest", "click", "icalendar", "recurring-ical-events"]

[tool.uv]
package = false
